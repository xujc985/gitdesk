name: Build GitDesk

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write  # v* 标签构建需要创建/更新 GitHub Release

env:
  GITDESK_VERSION: 1.0.0  # 可在构建时覆盖，用于正式版本号管理

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: windows, script: packaging/build-windows.ps1 }
          - { os: ubuntu-latest, platform: linux, script: packaging/build-linux.sh }
          - { os: macos-latest, platform: macos, script: packaging/build-macos.sh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Install Linux Qt runtime libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libgl1 libegl1 libxkbcommon-x11-0
      - name: Run tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Install appimagetool for Linux installer
        if: matrix.platform == 'linux'
        run: |
          curl -L https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
          sudo ln -sf /tmp/appimagetool /usr/local/bin/appimagetool
      - name: Build Windows Setup installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: ./packaging/build-windows.ps1
      - name: Build Linux AppImage installer
        if: matrix.platform == 'linux'
        run: sh packaging/build-linux.sh
      - name: Build macOS app and DMG (unsigned development build)
        if: matrix.platform == 'macos'
        env:
          GITDESK_SIGN: "0"
        run: sh packaging/build-macos.sh
      - name: Verify Windows installation and uninstallation
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GITDESK_SMOKE_LOG: ${{ github.workspace }}/build/package-smoke.json
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: ./packaging/verify-install.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: gitdesk-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

      - name: Publish installers to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" --title "GitDesk ${GITHUB_REF_NAME}" \
              --notes "GitDesk native installers: Windows Setup, Linux AppImage, macOS app DMG."
          fi
          gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber release/*
          echo "Published ${GITHUB_REF_NAME} installers to GitHub Release."
